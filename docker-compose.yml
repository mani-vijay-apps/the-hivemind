services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: the-hivemind-api
    container_name: the-hivemind-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    depends_on: [postgres]
    restart: unless-stopped
  postgres:
    image: postgres:17
    container_name: the-hivemind-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: